  triton-server:
    build:
      context: .
      dockerfile: Dockerfile.triton.jetson
    image: registry.cn-hangzhou.aliyuncs.com/eapil/tritonserver:26.04-py3-arm64-runtime
    platform: linux/arm64
    runtime: nvidia
    ipc: host
    volumes:
      - ./model_repository:/models
      - ./logs:/var/log/triton
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8003:8002"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Asia/Shanghai
      TRITON_LOG_FILE: /var/log/triton/server.log
      TRITON_LOG_MAX_SIZE: 100M
      TRITON_LOG_BACKUP_COUNT: "5"
      TRITON_MODEL_SET: ${TRITON_MODEL_SET-all}
      TRITON_MODEL_CONFIG: ${TRITON_MODEL_CONFIG-orin_gpu}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    command:
      - bash
      - -c
      - |
        mkdir -p /var/log/triton
        exec python3 /usr/local/bin/start_triton.py \
          --manifest /opt/triton/model_sets.json \
          --model-repository /models \
          --log-wrapper /usr/local/bin/run_triton_with_rotating_logs.py -- \
          tritonserver \
          --model-repository=/models \
          --allow-client-shm=true \
          --backend-config=onnxruntime,default-version=1 \
          --backend-config=tensorrt,default-version=1 \
          --backend-config=python,default-version=1 \
          --log-verbose=0 \
          --log-info=true \
          --log-warning=true \
          --log-error=true \
          --log-format=ISO8601
